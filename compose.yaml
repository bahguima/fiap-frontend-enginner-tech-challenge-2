services:
  dashboard-remote:
    build:
      context: .
      dockerfile: dashboard-remote/Dockerfile
      args:
        NEXT_PUBLIC_API_MOCKING: ${NEXT_PUBLIC_API_MOCKING:-enabled}
    environment:
      NEXT_PUBLIC_API_MOCKING: ${NEXT_PUBLIC_API_MOCKING:-enabled}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  shell:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DASHBOARD_REMOTE_URL: ${DASHBOARD_REMOTE_URL:-http://dashboard-remote:3001}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_API_MOCKING: ${NEXT_PUBLIC_API_MOCKING:-enabled}
        NEXT_PUBLIC_MSW_SCENARIO: ${NEXT_PUBLIC_MSW_SCENARIO:-success}
        NEXT_PUBLIC_MSW_DELAY_MS: ${NEXT_PUBLIC_MSW_DELAY_MS:-300}
    environment:
      DASHBOARD_REMOTE_URL: ${DASHBOARD_REMOTE_URL:-http://dashboard-remote:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_API_MOCKING: ${NEXT_PUBLIC_API_MOCKING:-enabled}
      NEXT_PUBLIC_MSW_SCENARIO: ${NEXT_PUBLIC_MSW_SCENARIO:-success}
      NEXT_PUBLIC_MSW_DELAY_MS: ${NEXT_PUBLIC_MSW_DELAY_MS:-300}
    depends_on:
      dashboard-remote:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
